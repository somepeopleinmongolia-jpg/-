<style>
:root{
  /* 原稿用紙の上で赤ペンが走る。1カラムの紙面、固定HUD、ステージは常に1枚だけ */
  --paper:#f1f7f2;
  --grid:#d3e5d9;
  --card:#fffffb;
  --ink:#13171d;
  --muted:#5a6a62;
  --pen:#e23a2e;
  --marker:#ffe34d;
  --f-display:"Dela Gothic One","Hiragino Sans","Yu Gothic","Noto Sans JP",sans-serif;
  --f-body:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic","Noto Sans JP",sans-serif;
  --f-doc:"Shippori Mincho","Hiragino Mincho ProN","Yu Mincho",serif;
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  background-color:var(--paper);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:24px 24px;
  color:var(--ink);color-scheme:light;
  font-family:var(--f-body);font-weight:500;font-size:16px;line-height:1.6;
  -webkit-tap-highlight-color:transparent;touch-action:manipulation;
}
#app{max-width:480px;margin:0 auto;padding:0 16px 48px;min-height:100vh}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,summary:focus-visible,a:focus-visible{outline:3px solid var(--pen);outline-offset:2px}
h1,h2,h3,p{margin:0}
h2,h3{text-wrap:balance}

/* buttons */
.btn{display:block;width:100%;border:2.5px solid var(--ink);background:var(--card);padding:13px 16px;border-radius:10px;font-weight:900;font-size:16px;text-align:left;box-shadow:4px 4px 0 var(--ink);transition:transform .08s,box-shadow .08s}
.btn:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--ink)}
.btn.primary{background:var(--ink);color:var(--paper);box-shadow:4px 4px 0 var(--pen);text-align:center;font-size:18px;padding:15px 16px}
.btn.primary:active{box-shadow:1px 1px 0 var(--pen)}
.btn.ghost{box-shadow:none;background:transparent;text-align:center;font-size:15px;padding:11px 14px}
.btn.ghost:active{transform:none;background:var(--card)}
.btn.marker{background:var(--marker)}
.btn[disabled]{opacity:.5;pointer-events:none}
.stack{display:flex;flex-direction:column;gap:12px}

/* cards */
.card{background:var(--card);border:2.5px solid var(--ink);border-radius:12px;box-shadow:5px 5px 0 var(--ink);padding:16px;display:flex;flex-direction:column;gap:12px}
.tag{align-self:flex-start;display:inline-block;font-size:12px;font-weight:900;letter-spacing:.08em;background:var(--ink);color:var(--paper);padding:2px 10px;border-radius:99px}
.ev-title{font-family:var(--f-display);font-size:23px;line-height:1.3;font-weight:400}
.ev-body{color:var(--muted);font-size:15px}
.res-text{font-size:17px;font-weight:700;line-height:1.65}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-block;padding:1px 9px;border:2px solid var(--ink);border-radius:6px;font-weight:900;font-size:13px;font-variant-numeric:tabular-nums;background:var(--card)}
.chip.good{background:var(--marker)}
.chip.bad{background:var(--pen);border-color:var(--pen);color:#fff}
.enter{animation:rise .22s ease-out}
@keyframes rise{from{opacity:.01;transform:translateY(10px)}to{opacity:1;transform:none}}

/* title */
.title{padding-top:20px;display:flex;flex-direction:column;gap:20px}
.filetab{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:700;color:var(--muted);border:2px solid var(--ink);background:var(--card);border-radius:8px;padding:5px 10px;align-self:flex-start;max-width:100%}
.filetab i{width:10px;height:10px;border-radius:2px;background:#2b579a;flex:none}
.filetab span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hero{position:relative;padding-top:4px}
.hero h1{font-family:var(--f-display);font-weight:400;line-height:1;display:flex;flex-direction:column;align-items:flex-start;gap:2px}
.hero .t1{font-size:clamp(60px,20vw,92px)}
.hero .t2{font-size:clamp(60px,20vw,92px);background:linear-gradient(transparent 64%,var(--marker) 64%);padding-right:6px}
.hero .t3{font-size:clamp(20px,6.4vw,30px);letter-spacing:.14em;background:var(--ink);color:var(--paper);padding:3px 12px;margin-top:8px}
.maru{position:absolute;right:2px;top:6px;width:76px;height:76px;border:4px solid var(--pen);border-radius:50%;color:var(--pen);display:grid;place-items:center;font-family:var(--f-display);font-size:34px;transform:rotate(12deg)}
.deadline{display:flex;align-items:baseline;gap:8px;font-weight:900}
.deadline b{font-family:var(--f-display);font-weight:400;font-size:38px;color:var(--pen);line-height:1}
.how{font-size:14.5px;color:var(--muted);display:flex;flex-direction:column;gap:2px}
.how b{color:var(--ink)}
label.lbl{font-size:13px;font-weight:900;display:block;margin-bottom:6px}
.inp{width:100%;font:inherit;font-size:16px;font-weight:700;border:2.5px solid var(--ink);border-radius:10px;padding:12px 14px;background:var(--card);color:var(--ink)}
.inp::placeholder{color:#8a9a92;font-weight:500}
.coll-note{font-size:13px;color:var(--muted);text-align:center}

/* HUD */
.hud{position:sticky;top:0;z-index:5;margin:0 -16px 16px;padding:8px 16px 10px;background:var(--card);border-bottom:2.5px solid var(--ink);display:flex;flex-direction:column;gap:6px}
.hud-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.fname{font-size:12px;font-weight:700;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:flex;gap:6px;align-items:center;min-width:0}
.fname i{width:9px;height:9px;border-radius:2px;background:#2b579a;flex:none}
.snd{border:2px solid var(--ink);background:var(--card);border-radius:6px;font-size:11px;font-weight:900;padding:1px 8px}
.hud-main{display:flex;justify-content:space-between;align-items:flex-end}
.count{display:flex;align-items:baseline;gap:8px}
.count small{font-size:12px;font-weight:900;color:var(--muted)}
.count b{font-family:var(--f-display);font-weight:400;font-size:34px;line-height:1;color:var(--pen)}
.ap{display:flex;gap:5px;align-items:center;font-size:12px;font-weight:900}
.ap i{width:16px;height:16px;border-radius:50%;border:2.5px solid var(--ink);background:var(--marker)}
.ap i.off{background:transparent}
.chars{display:flex;align-items:baseline;gap:6px}
.chars b{font-family:var(--f-display);font-weight:400;font-size:26px;line-height:1.1;font-variant-numeric:tabular-nums}
.chars span{font-size:13px;font-weight:700;color:var(--muted)}
.segs{display:grid;grid-template-columns:repeat(20,1fr);gap:2px;height:12px}
.segs i{border:1.5px solid var(--ink);background:transparent;border-radius:2px}
.segs i.on{background:var(--ink)}
.meters{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.m{display:grid;grid-template-columns:1fr auto;column-gap:4px;row-gap:2px;font-size:11.5px;font-weight:900}
.m em{grid-column:1 / -1;display:block;height:9px;border:2px solid var(--ink);border-radius:5px;overflow:hidden;background:transparent}
.m em i{display:block;height:100%;width:50%;background:var(--marker);border-right:2px solid var(--ink);transition:width .3s}
.m b{font-variant-numeric:tabular-nums}
.m.low em i{background:var(--pen)}
body.low .count b{animation:shake .4s infinite}
body.low #m-san span{color:var(--pen)}
@keyframes shake{0%,100%{transform:translate(0)}25%{transform:translate(-1.5px,1px)}75%{transform:translate(1.5px,-1px)}}

/* actions */
.actions{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.act{display:flex;flex-direction:column;gap:2px;align-items:flex-start}
.act .em{font-size:26px;line-height:1.2}
.act .nm{font-size:17px}
.act .ht{font-size:12px;font-weight:500;color:var(--muted);line-height:1.4}
.act.wide{grid-column:1 / -1;flex-direction:row;align-items:center;gap:12px}
.act.wide .tx{display:flex;flex-direction:column}
.sub{font-size:13px;font-weight:700;color:var(--muted);text-align:center}

/* frenzy */
.timer{height:12px;border:2.5px solid var(--ink);border-radius:7px;overflow:hidden}
.timer i{display:block;height:100%;background:var(--pen);transform-origin:left;transform:scaleX(1)}
.doc{height:132px;overflow:hidden;border:2px solid var(--ink);border-radius:8px;padding:8px 10px;font-family:var(--f-doc);font-size:15px;font-weight:500;line-height:24px;letter-spacing:.06em;word-break:break-all;background-color:var(--card);background-image:repeating-linear-gradient(transparent 0 23px,var(--grid) 23px 24px);background-attachment:local}
.tapbtn{position:relative;overflow:hidden;width:100%;height:130px;border:3px solid var(--ink);border-radius:14px;background:var(--pen);color:#fff;font-family:var(--f-display);font-size:30px;box-shadow:5px 5px 0 var(--ink);user-select:none;-webkit-user-select:none;touch-action:manipulation}
.tapbtn:active{transform:translate(3px,3px);box-shadow:2px 2px 0 var(--ink)}
.tapbtn[disabled]{background:var(--muted)}
.pop{position:absolute;pointer-events:none;font-family:var(--f-display);font-size:18px;color:var(--marker);text-shadow:1px 1px 0 var(--ink);animation:pop .6s ease-out forwards}
@keyframes pop{from{opacity:1;transform:translate(-50%,0)}to{opacity:0;transform:translate(-50%,-46px)}}
.fz-count{display:flex;align-items:baseline;justify-content:center;gap:4px;font-weight:900}
.fz-count b{font-family:var(--f-display);font-weight:400;font-size:40px;line-height:1;font-variant-numeric:tabular-nums}

/* result */
.result{padding-top:20px;display:flex;flex-direction:column;gap:16px}
.share{position:relative;gap:10px;background-color:var(--card);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:22px 22px;padding:18px 16px 16px}
.share .sc-head{font-size:12px;font-weight:900;letter-spacing:.1em;color:var(--muted);padding-right:80px}
.share .sc-theme{font-family:var(--f-doc);font-weight:700;font-size:16px;padding-right:80px;word-break:break-all}
.stamp{position:absolute;right:14px;top:14px;width:72px;height:72px;border:4.5px solid var(--pen);border-radius:50%;color:var(--pen);display:grid;place-items:center;font-family:var(--f-display);font-size:38px;transform:rotate(-12deg);background:rgba(255,255,251,.6);animation:slam .5s cubic-bezier(.2,1.4,.4,1) .15s both}
@keyframes slam{from{opacity:0;transform:rotate(-30deg) scale(2.6)}to{opacity:1;transform:rotate(-12deg) scale(1)}}
.sc-title{font-family:var(--f-display);font-weight:400;font-size:30px;line-height:1.2;margin-top:6px}
.sc-rank{display:inline-block;align-self:flex-start;background:var(--marker);border:2px solid var(--ink);border-radius:6px;font-weight:900;font-size:13px;padding:0 8px}
.sc-desc{font-size:15.5px;font-weight:700}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:6px 14px;margin:2px 0}
.stats div{display:flex;justify-content:space-between;gap:6px;border-bottom:2px solid var(--ink);padding-bottom:2px;font-size:14px}
.stats dt{font-weight:700;color:var(--muted)}
.stats dd{margin:0;font-weight:900;font-variant-numeric:tabular-nums}
.sc-log{font-size:20px;line-height:1.5;letter-spacing:.06em;white-space:pre-wrap}
.sc-tag{font-size:12px;font-weight:900;color:var(--pen)}
.share-btns{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.share-btns a.btn,.share-btns button.btn{text-align:center;text-decoration:none;color:var(--ink)}
.share-btns .full{grid-column:1 / -1}
details.box summary{font-size:13px;font-weight:700;color:var(--muted);cursor:pointer}
details.box textarea{width:100%;height:150px;margin-top:8px;font:inherit;font-size:14px;border:2px solid var(--ink);border-radius:8px;padding:8px;background:var(--card);color:var(--ink)}

/* mock thesis */
[hidden]{display:none!important}
.paper{font-family:var(--f-doc);font-weight:500;font-size:15.5px;line-height:1.95;letter-spacing:.03em;word-break:break-word;border:2px solid var(--ink);border-radius:8px;padding:14px 14px 16px;background-color:var(--card);background-image:repeating-linear-gradient(transparent 0 29px,var(--grid) 29px 30px);background-attachment:local;max-height:460px;overflow:auto}
.paper.raw{white-space:pre-wrap}
.paper:not(.raw){background-image:none}
.paper h4,.paper h5{margin:0;font-weight:700}
.paper p,.paper ul{margin:0 0 6px}
.paper ul{padding-left:1.3em}
.paper .th-fict{font-family:var(--f-body);font-size:12px;font-weight:700;color:var(--pen);line-height:1.5;margin-bottom:10px}
.paper .th-title{font-size:19px;line-height:1.5;text-align:center;margin-top:8px}
.paper .th-sub{text-align:center;font-size:14px}
.paper .th-meta{text-align:center;font-size:12.5px;color:var(--muted);line-height:1.7;margin:6px 0 12px}
.paper h5{font-size:16px;margin-top:10px}
.paper .th-tail{color:var(--muted);text-align:center;margin-top:16px}
.paper .th-red{font-family:var(--f-body);color:var(--pen);font-weight:900;font-size:13.5px;transform:rotate(-1.5deg);margin:-2px 0 8px 1.2em}
.paper .th-red::before{content:"✎ "}
.paper .th-tab{margin:6px 0 10px;overflow-x:auto}
.paper .th-tab table{border-collapse:collapse;font-size:13px;width:100%}
.paper .th-tab th,.paper .th-tab td{border-top:1px solid var(--ink);border-bottom:1px solid var(--ink);padding:2px 6px;text-align:left}
.paper figcaption{font-size:12.5px;font-weight:700;margin-bottom:2px}
.paper .th-fig{margin:6px 0 10px}
.paper .th-chart{display:flex;align-items:flex-end;gap:10%;height:64px;border-left:1.5px solid var(--ink);border-bottom:1.5px solid var(--ink);padding:0 8%}
.paper .th-chart i{flex:1;background:var(--muted)}
.paper .th-chart i:last-child{background:var(--pen)}
.paper .th-refs{list-style:none;padding-left:0;font-size:13.5px}
.note{font-size:12.5px;color:var(--muted);line-height:1.5}
.th-msg{font-size:13px;font-weight:700;color:var(--pen)}

.th-line{font-family:var(--f-body);margin:8px 0 12px;padding:8px 10px;border:2px dashed var(--muted);border-radius:12px;background:#e9f3ea;display:flex;flex-direction:column;gap:5px;line-height:1.5;letter-spacing:0}
.th-line .lh{font-size:11.5px;font-weight:900;color:var(--muted)}
.paper .bub{max-width:84%;margin:0;padding:4px 11px;border-radius:15px;font-size:14px;font-weight:700}
.bub.me{align-self:flex-end;background:#9be08a;border-bottom-right-radius:4px}
.bub.them{align-self:flex-start;background:#fff;border:1.5px solid var(--grid);border-bottom-left-radius:4px}
.th-line .lf,.th-letter .lf{font-family:var(--f-body);font-size:11px;font-weight:700;color:var(--pen)}
.th-letter{margin:10px 2px 14px;padding:12px 14px;background:#fff4f3;border:2px solid #f0b4b0;border-radius:4px;font-size:14.5px;line-height:1.9;transform:rotate(-.6deg);box-shadow:2px 3px 0 #f0b4b0}
.paper .th-letter p{margin:0}
.th-letter .to{font-weight:700}
.th-letter .sig{text-align:right;margin-top:4px}

.m{border:0;background:transparent;padding:0;text-align:left;font:inherit;font-size:11.5px;font-weight:900;color:inherit}
.unsaved{margin-left:auto;border:2px solid var(--ink);background:var(--card);border-radius:6px;font-size:11px;font-weight:900;padding:1px 7px;color:var(--ink)}
.unsaved.warn{background:var(--pen);border-color:var(--pen);color:#fff}
.helptip{font-size:12.5px;font-weight:700;line-height:1.55;background:var(--marker);border:2px solid var(--ink);border-radius:8px;padding:8px 10px;cursor:pointer}
.nohit{font:inherit;font-size:11px;font-weight:900;border:2px solid var(--ink);background:var(--marker);color:var(--ink);border-radius:6px;padding:0 6px;margin-left:4px}
.nohit.hit{background:var(--pen);border-color:var(--pen);color:#fff}
.sc-near{font-size:13px;font-weight:900;color:var(--pen)}
.card.incident{border-color:var(--pen);box-shadow:5px 5px 0 var(--pen)}

.tform{border:0;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.trow{display:flex;align-items:center;gap:8px}
.trow .inp{flex:1;min-width:0}
.trow span{font-family:var(--f-doc);font-weight:700;font-size:16px;flex:none;width:5.2em}
.tdice{width:auto;flex:none;padding:10px 14px;font-size:20px}
.tprev{font-family:var(--f-doc);font-weight:700;font-size:15px;word-break:break-all}

.toast{position:fixed;left:12px;right:12px;bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:70;background:var(--ink);color:var(--paper);border-radius:10px;padding:10px 12px;font-size:13px;font-weight:700;line-height:1.5;box-shadow:4px 4px 0 var(--pen)}

/* lab gacha */
.gacha{padding-top:20px;display:flex;flex-direction:column;gap:14px}
.g-title{font-family:var(--f-display);font-weight:400;font-size:clamp(34px,10vw,44px);line-height:1.1;background:linear-gradient(transparent 62%,var(--marker) 62%);align-self:flex-start;padding-right:6px}
.g-stage{min-height:200px;display:grid;place-items:center}
.capsule{width:132px;height:132px;border-radius:50%;border:3px solid var(--ink);background:linear-gradient(var(--pen) 50%,var(--card) 50%);box-shadow:5px 5px 0 var(--ink);display:grid;place-items:center;position:relative}
.capsule::after{content:"";position:absolute;left:-3px;right:-3px;top:calc(50% - 2px);height:4px;background:var(--ink)}
.capsule span{position:relative;z-index:1;width:54px;height:54px;border-radius:50%;background:var(--card);border:3px solid var(--ink);display:grid;place-items:center;font-family:var(--f-display);font-size:28px}
.capsule.spin{animation:wobble .95s ease-in-out}
@keyframes wobble{0%,100%{transform:rotate(0)}15%{transform:rotate(-18deg)}30%{transform:rotate(16deg)}45%{transform:rotate(-12deg) scale(1.04)}60%{transform:rotate(10deg) scale(1.08)}80%{transform:rotate(-4deg) scale(1.12)}}
.g-odds{font-size:12px;font-weight:700;color:var(--muted);text-align:center}
.labcard{width:100%;position:relative}
.lab-head{display:flex;justify-content:space-between;align-items:center}
.rar{font-family:var(--f-display);font-size:20px;line-height:1;padding:4px 10px;border:2.5px solid var(--ink);border-radius:8px;background:var(--card)}
.rar-SSR .rar{background:var(--pen);color:#fff}
.rar-SR .rar{background:var(--marker)}
.card.rar-SSR{box-shadow:5px 5px 0 var(--pen)}
.lab-em{font-size:40px;line-height:1}
.lab-prof{font-size:14px;font-weight:900}
.lab-type{display:inline-block;margin-left:8px;vertical-align:middle;font-family:var(--f-body);font-size:13px;font-weight:900;border:2px solid var(--ink);border-radius:6px;padding:0 7px;background:var(--marker)}
.lab-fx{margin:0;padding-left:1.2em;font-size:14px;font-weight:700;display:flex;flex-direction:column;gap:2px}
.stats .star{color:var(--pen);letter-spacing:.04em}
.stats div.wide{grid-column:1 / -1}
.labchip{flex:none;font-size:11px;font-weight:900;border:2px solid var(--ink);border-radius:6px;padding:0 6px;background:var(--marker);max-width:46%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* collection */
.coll{display:flex;flex-direction:column;gap:8px}
.coll h3{font-family:var(--f-display);font-weight:400;font-size:20px}
.coll ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.coll li{border:2px solid var(--ink);border-radius:8px;padding:8px 10px;background:var(--card);display:flex;gap:10px;align-items:flex-start}
.coll li.lock{background:transparent;border-style:dashed;color:var(--muted)}
.coll .ce{font-size:24px;line-height:1.2}
.coll .cn{font-weight:900;font-size:15px}
.coll .cd{font-size:13px;color:var(--muted);line-height:1.45}

/* animations */
.hero .t1,.hero .t2,.hero .t3{animation:slideIn .5s cubic-bezier(.2,1.2,.4,1) both}
.hero .t2{animation-delay:.12s}.hero .t3{animation-delay:.24s}
@keyframes slideIn{from{opacity:0;transform:translateX(-28px)}to{opacity:1;transform:none}}
.maru{animation:maruIn .5s cubic-bezier(.2,1.4,.4,1) .4s both,maruWobble 3.2s ease-in-out 1.4s infinite}
@keyframes maruIn{from{opacity:0;transform:rotate(-20deg) scale(2.2)}to{opacity:1;transform:rotate(12deg) scale(1)}}
@keyframes maruWobble{0%,86%,100%{transform:rotate(12deg)}90%{transform:rotate(2deg) scale(1.06)}95%{transform:rotate(18deg)}}
.daycut{position:fixed;left:0;right:0;top:38%;z-index:20;pointer-events:none;display:flex;justify-content:center}
.daycut div{background:var(--ink);color:var(--paper);border:3px solid var(--ink);box-shadow:6px 6px 0 var(--pen);padding:10px 22px;display:flex;align-items:baseline;gap:12px;animation:dayCut 1.15s cubic-bezier(.3,.9,.4,1) both}
.daycut b{font-family:var(--f-display);font-weight:400;font-size:40px;line-height:1}
.daycut span{font-weight:900;font-size:18px;color:var(--marker)}
@keyframes dayCut{0%{opacity:0;transform:translateX(70vw) skewX(-12deg)}22%{opacity:1;transform:translateX(0) skewX(0)}74%{opacity:1;transform:translateX(0)}100%{opacity:0;transform:translateX(-70vw) skewX(12deg)}}
.chip{animation:chipIn .32s cubic-bezier(.2,1.5,.4,1) both}
@keyframes chipIn{from{opacity:0;transform:scale(.4)}to{opacity:1;transform:none}}
.chars b.bump{animation:bump .35s ease-out}
@keyframes bump{40%{transform:scale(1.18);color:var(--pen)}}
.labcard.flip{animation:flipIn .55s cubic-bezier(.2,1.2,.4,1) both}
@keyframes flipIn{from{opacity:0;transform:perspective(700px) rotateY(85deg) scale(.9)}to{opacity:1;transform:none}}
.g-stage{position:relative}
.flash{position:absolute;inset:-20px;border-radius:24px;pointer-events:none;animation:flash .8s ease-out forwards}
.flash.SR{background:radial-gradient(circle,var(--marker) 0,transparent 70%)}
.flash.SSR{background:radial-gradient(circle,#fff 0,var(--marker) 35%,var(--pen) 60%,transparent 75%)}
@keyframes flash{from{opacity:1;transform:scale(.6)}to{opacity:0;transform:scale(1.5)}}
.card.rar-SSR.flip{animation:flipIn .55s cubic-bezier(.2,1.2,.4,1) both,ssrGlow 1.6s ease-in-out .6s infinite}
@keyframes ssrGlow{0%,100%{box-shadow:5px 5px 0 var(--pen)}50%{box-shadow:5px 5px 0 var(--pen),0 0 22px 4px var(--marker)}}
body.faint::after{content:"";position:fixed;inset:0;z-index:30;pointer-events:none;background:#fff;animation:faint .9s ease-out forwards}
@keyframes faint{0%{opacity:0}25%{opacity:1}100%{opacity:0}}
body.faint #stage{animation:shake .4s 2}
.paper.reveal>*{animation:rise .35s ease-out both}
.confetti{position:fixed;inset:0;z-index:25;pointer-events:none;overflow:hidden}
.confetti i{position:absolute;top:-20px;width:9px;height:14px;border:1.5px solid var(--ink);animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}

@media (prefers-reduced-motion:reduce){
  .enter,.stamp,.pop,body.low .count b,.capsule.spin,.hero .t1,.hero .t2,.hero .t3,.maru,.daycut div,.chip,.chars b.bump,.labcard.flip,.card.rar-SSR.flip,.flash,body.faint::after,body.faint #stage,.paper.reveal>*{animation:none}
  .daycut,.confetti{display:none}
  .btn,.m em i{transition:none}
}
</style>

<div id="app"><div id="root"></div></div>
<noscript>JavaScriptを有効にしてください。</noscript>
<script>
(function(){
'use strict';

/* ---------- constants & helpers ---------- */
var GOAL=10000, DAYS=10, AP_PER_DAY=2;
var KEY='sotsuron-endings-v1';
var rand=function(a,b){return Math.floor(Math.random()*(b-a+1))+a};
var chance=function(p){return Math.random()<p};
var pick=function(a){return a[Math.floor(Math.random()*a.length)]};
var clamp=function(v,a,b){return Math.max(a,Math.min(b,v))};
var fmt=function(n){return Math.round(n).toLocaleString('ja-JP')};
var esc=function(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})};
var $=function(s,r){return (r||document).querySelector(s)};
function el(tag,cls){var e=document.createElement(tag);if(cls)e.className=cls;return e}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}

var memEnd=[];
function loadEnd(){try{var v=JSON.parse(localStorage.getItem(KEY)||'[]');if(Array.isArray(v))memEnd=v}catch(e){}return memEnd}
function saveEnd(id){loadEnd();if(memEnd.indexOf(id)<0)memEnd.push(id);try{localStorage.setItem(KEY,JSON.stringify(memEnd))}catch(e){}}

/* ---------- sound (tiny, optional) ---------- */
var audio=null, soundOn=true;
function blip(freq,dur,type,vol){
  if(!soundOn)return;
  try{
    audio=audio||new (window.AudioContext||window.webkitAudioContext)();
    var o=audio.createOscillator(),g=audio.createGain(),t=audio.currentTime;
    o.type=type||'square';o.frequency.value=freq;
    g.gain.setValueAtTime(vol||0.03,t);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    o.connect(g);g.connect(audio.destination);o.start(t);o.stop(t+dur);
  }catch(e){}
}
function jingle(good){
  var n=good?[523,659,784,1047]:[330,262,220,165];
  n.forEach(function(f,i){setTimeout(function(){blip(f,0.18,good?'triangle':'sawtooth',0.05)},i*130)});
}
function buzz(ms){try{if(navigator.vibrate)navigator.vibrate(ms)}catch(e){}}

/* ---------- content ---------- */
var FNAMES=['卒論.docx','卒論_修正.docx','卒論_修正2.docx','卒論_修正2_確認用.docx','卒論_最終.docx','卒論_最終_v2.docx','卒論_最終_本当に最終.docx','卒論_最終_本当に最終_2.docx','卒論_最終_これで提出.docx','卒論_提出用_絶対これ.docx'];

var FRAGS=['本研究では','以上のことから','有意な差は認められなかった','と考えられる','今後の課題としたい','先行研究によれば','図1に示す','p < 0.05','一方で','すなわち','実験の結果','考察','において','を行った','が示唆された','ことが明らかとなった','これらの結果は','に着目し','仮説を立てた','再現性を確認した','さらに','また'];
var CRAZY=['もうだめ','睡眠とは何か','カレーうどん','提出日は存在しない','あと一行','おなかすいた','だれか','Ctrl+S','ねむい','ここはどこ','猫','留年','教授ごめんなさい','単位とは','あああああ'];

var ACTIONS=[
  {id:'write',em:'✍️',nm:'書く',ht:'連打で字数を稼ぐ。研究の質が高いほど速い'},
  {id:'read',em:'📚',nm:'文献を読む',ht:'研究の質が上がる。当たり外れあり'},
  {id:'exp',em:'🧪',nm:'実験・解析',ht:'成功すれば質が大きく上がる。質が高いほど成功しやすい'},
  {id:'ask',em:'🙇',nm:'教授に相談',ht:'信頼が上がる。手ぶらで行くと逆効果'},
  {id:'sleep',em:'🛌',nm:'寝る',ht:'正気度が回復する。寝坊することも',wide:true}
];

/* 行動の結果。どれもランダムで、ほかのパラメーターの影響を受ける */
var ACT_RUN={
  read:function(){
    var r=Math.random();
    if(r<0.18)return {t:pick(['参考文献の参考文献で、神論文を見つけた。全部ここに書いてあった。','読んだ論文の図が、まさに自分の言いたいことだった。']),fx:{q:rand(16,22),t:3,c:rand(150,250),s:-3}};
    if(r<0.35){mark('lostread');return {t:pick(['3時間読んだ。1行も理解できなかった。','PDFを開いたまま寝ていた。よだれの跡が残った。','英語の論文だと思ったら、ドイツ語だった。']),fx:{q:2,s:-7}}}
    return {t:pick(['英語の論文を3本読んだ。2本目から記憶がない。','Introductionだけで30分かかった。でも要点は掴んだ。','孫引きをたどって、やっと原典に着いた。','Discussionに自分と同じ悩みが書いてあった。少し救われた。']),
      fx:{q:rand(8,13),c:rand(80,160),s:-4}};
  },
  exp:function(){
    var p=0.42+S.q/250;
    if(chance(0.07)){mark('breakthrough');return {t:'予想と真逆の結果が出た。……これ、もしかして大発見では?',fx:{q:rand(24,30),t:8,c:rand(400,600),s:-6}}}
    if(chance(p)){
      return {t:pick(['データがきれいに揃った。グラフにした瞬間、報われた。','再現性あり。今日だけは自分を褒めていい。','エラーが消えて、図が出た。思わず声が出た。']),
        fx:{q:rand(14,20),c:rand(200,350),s:-6}};
    }
    mark('fail');
    return {t:pick(['結果が毎回違う。これを再現性とは呼べない。','あと一歩でエラー。原因は半角スペースだった。','対照区のほうが元気だった。','条件をひとつ変え忘れていた。']),
      fx:{q:3,s:-11}};
  },
  ask:function(){
    if(chance(L.absent)){
      return {t:pick(['教授室は空だった。ドアに「出張中」の札。','メールしたら「来週戻ります」とだけ返ってきた。']),fx:{s:-3}};
    }
    if(S.q<25){
      return {t:pick(['「で、データは?」と聞かれて、何も出せなかった。','「何がしたいのか、まだ見えないね」。正論が刺さる。']),fx:{t:-6,q:5,s:-7}};
    }
    if(chance(L.ask+(S.q-40)/250)){
      return {t:pick(['「方向性いいと思うよ」と言われた。胃がゆるんだ。','「この図、わかりやすいね」だけで3日は戦える。','「このまま進めて」。短いけど、最高の一言だった。']),fx:{t:rand(9,13),q:4,s:-2}};
    }
    return {t:pick(['「で、結論は?」の一言で背筋が伸びた。','「構成を見直したほうがいい」。的確すぎて反論できない。']),fx:{t:2,q:Math.round(8*L.askQ),s:-9}};
  },
  sleep:function(){
    var r=Math.random();
    if(r<0.14&&S.ap>1){mark('oversleep');return {t:'目覚ましを止めた記憶がない。起きたら夕方だった。',fx:{s:rand(34,40),ap:-1}}}
    if(r<0.26){mark('dream');return {t:'夢の中で考察が完成した。起きてすぐメモした。半分は読めない。',fx:{s:rand(18,24),c:rand(200,350),q:2}}}
    return {t:pick(['9時間寝た。脳が静かに回復している。','布団が優しい。卒論の存在を一瞬忘れた。','夢の中でも参考文献を整えていた。']),fx:{s:rand(22,28)}};
  }
};

/* 行動のあとに、たまに起きるハプニング(1日1回まで)。未保存の原稿は消えることがある */
var INCIDENTS=[
  {w:3,em:'💻',title:'PCが突然フリーズした',
    avoid:function(){return S.chars-S.saved<=0?{t:'再起動した。保存してあったので、何も失わなかった。',fx:{s:-2}}:null},
    run:function(){
      var u=S.chars-S.saved,lose=Math.round(u*(0.6+Math.random()*0.4));mark('lost');
      return {t:'再起動したら、最後に保存した時点に戻っていた。'+fmt(lose)+'字が消えた。',fx:{c:-lose,s:-12}};
  }},
  {w:1,em:'🔌',title:'足がケーブルに引っかかった',
    avoid:function(){return S.chars-S.saved<=0?{t:'電源が抜けた。でも保存してあった。昨日の自分、えらい。',fx:{}}:null},
    run:function(){var u=S.chars-S.saved;mark('lost');return {t:'電源が抜けて、画面が真っ暗になった。保存していない分は、全部消えた。',fx:{c:-u,s:-15}}}},
  {w:2,em:'☕',title:'コーヒーをキーボードにこぼした',
    avoid:function(){return S.san>=40?{t:'とっさにカップを押さえた。反射神経はまだ死んでいない。',fx:{}}:null},
    run:function(){mark('coffee');return {t:'疲れて手元が狂った。キーボードの「の」が反応しなくなった。',fx:{s:-8}}}},
  {w:2,em:'💡',title:'シャワー中にひらめいた',run:function(){return {t:'考察の続きが、急に全部見えた。忘れないうちに書いた。',fx:{c:rand(250,450),q:3}}}},
  {w:2,em:'🍙',title:'先輩が差し入れをくれた',run:function(){return {t:'おにぎりと、「大丈夫、みんな通った道だから」の一言。',fx:{s:12}}}},
  {w:2,em:'🚪',title:'教授が抜き打ちで覗きに来た',
    avoid:function(){return S.q>=40?{t:'画面を見て「お、進んでるね」と言って去っていった。',fx:{t:8}}:null},
    run:function(){mark('visit');return {t:'画面を見て、何も言わずに去っていった。それが一番こわい。',fx:{t:-8,s:-5}}}},
  {w:1,em:'☁️',title:'自動バックアップが動いていた',run:function(){return {t:'知らないうちにクラウドに全部保存されていた。テクノロジーに感謝。',fx:{save:1}}}},
  {w:1,em:'🐈',title:'猫が膝に乗ってきた',run:function(){mark('cat');return {t:'猫が動くまで、何もできない。それでいい。',fx:{s:8,c:60}}}}
];
function rollIncident(){
  if(!S||S.incToday||S.chars<=0&&chance(0.5))return null;
  if(!chance(0.16+(S.san<30?0.1:0)))return null;
  S.incToday=true;
  var tot=0;INCIDENTS.forEach(function(x){tot+=x.w});
  var r=Math.random()*tot;
  for(var i=0;i<INCIDENTS.length;i++){r-=INCIDENTS[i].w;if(r<0)return INCIDENTS[i]}
  return INCIDENTS[0];
}

var EVENTS=[
  {id:'word',em:'💾',tag:'トラブル',title:'Wordが突然フリーズした',body:'「応答なし」の文字。最後に保存したのはいつだったか。',choices:[
    {label:'自動回復に祈る',run:function(){
      if(chance(0.45))return {t:'回復ペインに全文が残っていた。神に感謝した。',fx:{save:1}};
      var u=S.chars-S.saved;
      if(u<=0)return {t:'祈りは届かなかった。でも保存してあったので無事だった。',fx:{s:-4}};
      mark('lost');
      return {t:'祈りは届かなかった。最後の保存から先、'+fmt(u)+'字が消えた。',fx:{c:-u,s:-14}};
    }},
    {label:'最後に保存した版から復元',run:function(){
      var u=S.chars-S.saved;
      if(u<=0)return {t:'保存した版に戻した。何も失わなかった。',fx:{s:-2}};
      mark('lost');
      return {t:'保存した版には戻せた。そのあと書いた'+fmt(u)+'字は、なかったことにする。',fx:{c:-Math.round(u*0.8),s:-4}};
    }}]},
  {id:'nomi',em:'🍻',tag:'誘惑',title:'同期から飲みの誘い',body:'「息抜きしようぜ」の一言が、悪魔の囁きに聞こえる。',choices:[
    {label:'行く',run:function(){return {t:'笑った。卒論の話は一回も出なかった。最高だった。',fx:{s:24,ap:-1}}}},
    {label:'断って家に帰る',run:function(){return {t:'友情に少しヒビ。でも少し書けた。',fx:{s:-6,c:250}}}}]},
  {id:'mail',em:'📧',tag:'メール',title:'教授から「進捗どう?」',body:'件名はそれだけ。本文もほぼそれだけ。',choices:[
    {label:'「順調です」と盛って返す',run:function(){
      if(chance(0.6))return {t:'「期待してるよ」と返ってきた。胃が痛い。',fx:{t:10}};
      return {t:'「じゃあ来週、途中までみせて」。盛った分が返ってきた。',fx:{t:-14,s:-6}};
    }},
    {label:'正直に遅れを伝える',run:function(){return {t:'心配されたが、対策を一緒に考えてくれた。',fx:{t:4,q:4,s:-2}}}}]},
  {id:'prior',em:'🔍',tag:'研究',title:'先行研究が見つからない',body:'検索ワードを変えて2時間。同じ論文ばかり出てくる。',choices:[
    {label:'一晩かけて探す',run:function(){return {t:'3本目の英語論文でやっと見つけた。',fx:{q:14,s:-12}}}},
    {label:'「新規性がある」ことにする',run:function(){
      mark('novel');if(chance(0.7))return {t:'「新規性」と書いたら、教授も頷いた。',fx:{t:5,q:4}};
      return {t:'「それ、〇〇さんがもうやってるよ」と一撃で撃墜された。',fx:{t:-10,q:-6}};
    }}]},
  {id:'ai',em:'🤖',tag:'誘惑',title:'AIが目の前でスタンバイしている',body:'「卒論、手伝おうか?」カーソルが点滅している。',choices:[
    {label:'全部書かせる',run:function(){
      mark('ai');if(chance(L.detect))return {t:'文体が急に変わったのを教授に見抜かれた。',fx:{c:3000,q:-12,t:-25,sus:1}};
      return {t:'3000字が一瞬で貼れた。誰にも気づかれなかった(と思う)。',fx:{c:3000,q:-12}};
    }},
    {label:'誤字チェックだけ頼む',run:function(){return {t:'誤字と「てにをは」を直してもらった。読みやすい。',fx:{q:8,s:4}}}},
    {label:'自分の言葉で書く',run:function(){return {t:'誰も褒めてくれないけど、これは自分の卒論だ。',fx:{q:3,s:-5,t:3}}}}]},
  {id:'conta',em:'🧫',tag:'トラブル',title:'実験が全滅した',body:'ふたを開けた瞬間にわかった。全部やり直しだ。解析がエラーで止まった人も同じ顔になる。',choices:[
    {label:'最初からやり直す',run:function(){return {t:'一から。2回目は手が覚えていた。',fx:{ap:-1,q:6,s:-10}}}},
    {label:'失敗も結果として書く',run:function(){
      mark('fail');if(chance(0.4))return {t:'「予想外の結果」が面白がられた。',fx:{q:14,c:500}};
      return {t:'「それで何がわかったの?」教授の目が笑っていない。',fx:{t:-8,c:500}};
    }}]},
  {id:'line',em:'👀',tag:'焦り',title:'同期がもう提出したらしい',body:'グループLINEに「おわたー!」のスタンプが流れてきた。',choices:[
    {label:'焦って書く',run:function(){mark('rush');return {t:'焦りは文字数に変わる。内容はあとで考える。',fx:{c:900,s:-14,q:-4}}}},
    {label:'通知を切る',run:function(){return {t:'LINEをミュートした。心が少し軽い。',fx:{s:6}}}},
    {label:'先輩の卒論を参考にする',run:function(){
      if(chance(1-L.detect*0.8))return {t:'構成の勉強になった。ありがたい。',fx:{q:10,c:300}};
      mark('senpai');return {t:'参考にしたつもりが、似すぎていた。',fx:{c:1200,t:-15,sus:1}};
    }}]},
  {id:'zemi',em:'🎤',tag:'ゼミ',title:'ゼミ発表が明日だった',body:'カレンダーを見て、血の気が引いた。',choices:[
    {label:'徹夜で資料を作る',run:function(){return {t:'資料は仕上がった。発表の評価も上々。目の下はひどい。',fx:{t:14,s:-20,q:6}}}},
    {label:'即興で乗り切る',run:function(){

  S={day:1,ap:AP_PER_DAY,chars:0,san:L.san,trust:L.trust,q:L.q,sus:0,boost:false,down:false,lab:L.lab.id,sur:L.sur,marks:{},scraps:[],crazyN:0,saved:0,hits:0,dodged:0,incToday:false,cut:0,minSan:100,writes:0,sleeps:0,coffee:0,backups:0,dayLog:[],theme:theme||'',queue:shuffle(EVENTS).slice(0,DAYS-1)};
  hist=[];
}

function apply(fx,em){
  var chips=[];
  if(L&&((fx.t>0&&L.tg!==1)||(fx.q>0&&L.qg!==1))){
    fx=Object.assign({},fx);
    if(fx.t>0)fx.t=Math.max(1,Math.round(fx.t*L.tg));
    if(fx.q>0)fx.q=Math.max(1,Math.round(fx.q*L.qg));
  }
  function stat(key,name,prop){
    if(!fx[key])return;
    var b=S[prop];S[prop]=clamp(S[prop]+fx[key],0,100);
    var d=S[prop]-b;
    if(d)chips.push({v:d,label:name+' '+(d>0?'+':'−')+Math.abs(d)});
  }
  if(fx.c){
    var b=S.chars;S.chars=Math.max(0,S.chars+Math.round(fx.c));
    var d=S.chars-b;
    if(d)chips.push({v:d,label:(d>0?'+':'−')+fmt(Math.abs(d))+'字'});
  }
  stat('s','正気度','san');stat('t','教授の信頼','trust');stat('q','研究の質','q');
  S.saved=Math.min(S.saved,S.chars);
  if(fx.save){S.saved=S.chars;chips.push({v:1,label:'保存済み'})}
  S.minSan=Math.min(S.minSan,S.san);
  if(fx.sus){S.sus+=fx.sus;chips.push({v:-1,label:'疑惑 +'+fx.sus})}
  if(fx.ap){
    var a=S.ap;S.ap=Math.max(0,S.ap+fx.ap);
    var da=S.ap-a;
    if(da<0){for(var i=0;i<-da;i++)S.dayLog.push(em||'⏳');chips.push({v:-1,label:'今日の行動 '+da})}
  }
  updateHUD();
  return chips;
}

function countTo(node,to){
  var from=+(node.dataset.v||0);node.dataset.v=to;
  if(from===to){node.textContent=fmt(to);return}
  node.classList.remove('bump');void node.offsetWidth;node.classList.add('bump');
  var t0=performance.now(),dur=450;
  (function step(){
    var p=Math.min(1,(performance.now()-t0)/dur),e=1-Math.pow(1-p,3);
    if(node.dataset.v!=String(to))return;
    node.textContent=fmt(from+(to-from)*e);
    if(p<1)requestAnimationFrame(step);
  })();
}

  var chips=apply(r.fx,a.em);

  showResult(r.t,chips);
}

function doWrite(){
  var boost=S.boost, crazy=S.san<30, DUR=5000, taps=0;
  // 1タップの字数:研究の質が高いほど速い(書くことがある)。正気度が低いと遅い。30タップを超えると手が疲れて半分
  var mult=(0.7+S.q/100)*(crazy?0.75:1)*L.wm*(boost?1.5:1);
  var card=el('div','card frenzy');
  card.innerHTML='<span class="tag">書く ・ 5秒 ・ 速さ ×'+mult.toFixed(2)+(boost?'(エナドリ)':'')+'</span>'+
    '<div class="timer"><i id="tbar"></i></div>'+
    '<div class="doc" id="doc"></div>'+
    '<button class="tapbtn" id="tap" type="button" aria-label="連打して書く">タップで書き始める</button>'+
    '<div class="fz-count"><b id="fzc">0</b><span>字</span></div>';
  stage(card);
  var started=false,over=false,t0=0,total=0,txt='',raf=0;
  var btn=$('#tap'),docEl=$('#doc'),bar=$('#tbar'),cnt=$('#fzc');

  function tap(x,y){
    if(over)return;
    if(!started){started=true;t0=performance.now();btn.textContent='叩け!!';loop()}
    taps++;
    var n=Math.max(1,Math.round(rand(21,29)*mult*(taps>32?0.45:1)));
    total+=n;
    var cz=crazy&&chance(0.55);
    var f=cz?pick(CRAZY):pick(FRAGS);
    if(cz){S.crazyN++;if(S.scraps.indexOf(f)<0&&S.scraps.length<6)S.scraps.push(f)}
    txt+=f+(chance(0.35)?'。':'');
    if(txt.length>300)txt=txt.slice(-260);
    docEl.textContent=txt;docEl.scrollTop=docEl.scrollHeight;
    cnt.textContent=fmt(total);
    var p=el('span','pop');p.textContent='+'+n;
    var r=btn.getBoundingClientRect();
    p.style.left=(x==null?r.width/2:x-r.left)+'px';
    p.style.top=(y==null?r.height/2:y-r.top)+'px';
    btn.appendChild(p);
    if(btn.querySelectorAll('.pop').length>14)btn.removeChild(btn.querySelector('.pop'));
    setTimeout(function(){if(p.parentNode)p.parentNode.removeChild(p)},650);
    blip(360+Math.random()*300,0.04,'square',0.02);
    buzz(6);
  }
  function loop(){
    var p=(performance.now()-t0)/DUR;
    bar.style.transform='scaleX('+Math.max(0,1-p)+')';
    if(p>=1){end();return}
    raf=requestAnimationFrame(loop);
  }
  function end(){
    over=true;cancelAnimationFrame(raf);btn.disabled=true;btn.textContent='時間切れ';
    setTimeout(function(){
      S.boost=false;
      var fx={c:total,s:total===0?-2:-(8+(boost?6:0)+L.wc)};
      var t=total===0?'画面を見つめて終わった。0字。':
        total<350?'指が重い。1行ずつ絞り出した。':
        total<650?'まずまずのペース。段落がひとつ増えた。':
        total<950?'ゾーンに入った。時間が溶けた。':
        '神が降りてきた。指が勝手に動いた。';
      if(total>0&&chance(0.12)){fx.c=Math.round(total*1.3);fx.q=-5;mark('drift');t+=' ……勢いで書いたら、途中から何の話かわからなくなった。'}
      S.writes++;
      if(boost)t+=' エナドリが切れて、どっと疲れた。';
      spend('✍️');
      var chips=apply(fx,'✍️');
      jingle(total>=1300);
      showResult(t,chips);
    },500);
  }
  btn.addEventListener('pointerdown',function(e){e.preventDefault();tap(e.clientX,e.clientY)});
  btn.addEventListener('keydown',function(e){if(e.key===' '||e.key==='Enter'){e.preventDefault();tap()}});
  btn.addEventListener('click',function(e){e.preventDefault()});
  try{btn.focus({preventScroll:true})}catch(e){}
}

function endDay(){
  hist.push(S.dayLog.join('')||'💤');
  if(S.day>=DAYS)return finish(false);
  var u=S.chars-S.saved;
  if(u>0)return showBackup(u);
  nightEnd();
}
function nightEnd(){
  if(L.night)S.san=clamp(S.san+L.night,1,100);
  S.day++;
  beginDay();
}
/* 寝る前のバックアップ:少し正気度を使うが、未保存の原稿を守れる */
function showBackup(u){
  var card=el('div','card');
  card.innerHTML='<span class="tag">夜 ・ DAY '+S.day+'</span><h2 class="ev-title">💾 寝る前に、バックアップする?</h2><p class="ev-body">未保存の原稿が <b>'+fmt(u)+'字</b> ある。USBとクラウドに保存するには、もうひと頑張り必要だ。</p>';
  var box=el('div','stack');
  [['保存してから寝る(正気度 −4)',function(){S.backups++;return {t:'保存した。これで明日、何が起きても大丈夫……のはず。',fx:{save:1,s:-4}}}],
   ['眠いのでそのまま寝る',function(){mark('nosave');return {t:'明日の自分が、きっとなんとかしてくれる。',fx:{}}}]].forEach(function(c){
    var b=el('button','btn');b.type='button';b.textContent=c[0];
    b.onclick=function(){
      Array.prototype.forEach.call(box.children,function(x){x.disabled=true});
      var r=c[1](),chips=apply(r.fx,'💾');
      var res=el('div','card');
      res.innerHTML='<p class="res-text">'+esc(r.t)+'</p>'+(chips.length?'<div class="chips">'+chips.map(chipHTML).join('')+'</div>':'');
      var nb=el('button','btn primary');nb.type='button';nb.textContent='朝になる';nb.onclick=nightEnd;
      res.appendChild(nb);stage(res);
    };
    box.appendChild(b);
  });
  card.appendChild(box);stage(card);
}
/* 4日目・8日目の朝:教授の赤ペン添削。質が低い水増しは削られる。信頼が高いと手加減してもらえる */
function showReview(next){
  var rate=S.q<30?0.16:S.q<50?0.09:S.q<70?0.04:0;
  if(S.trust>=60)rate*=0.5;
  if(L.lab.id==='oni')rate+=0.05;
  if(L.lab.id==='hotoke')rate*=0.5;
  var cut=Math.round(S.chars*rate);
  var who=L.sur+'先生';
  var t=S.chars<300?who+'「まだ何もないじゃない。……まあ、これからだね」':
    cut>0?who+'「この段落、何が言いたいの?」原稿が赤く染まり、'+fmt(cut)+'字が削られた。':
    who+'「うん、この調子で」。赤ペンはほとんど入らなかった。';
  if(cut>0){S.cut+=cut;mark('redpen')}
  var chips=apply(cut>0?{c:-cut,t:S.q>=50?3:-3}:{t:4},'🖍️');
  var card=el('div','card');
  card.innerHTML='<span class="tag">DAY '+S.day+' ・ 赤ペン添削</span><h2 class="ev-title">🖍️ 教授から原稿が返ってきた</h2><p class="res-text">'+esc(t)+'</p>'+(chips.length?'<div class="chips">'+chips.map(chipHTML).join('')+'</div>':'')+'<p class="ev-body" style="font-size:13px">研究の質が低いほど、水増しは削られる。信頼が高いと手加減してもらえる。</p>';
  var b=el('button','btn primary');b.type='button';b.textContent='今日をはじめる';b.onclick=next;
  card.appendChild(b);stage(card);
}

function judge(early){
  if(S.chars<1000)return 'blank';
  if(S.sus>=1&&S.trust<L.susT)return 'sus';
  var m=S.marks||{};
  if(S.chars>=GOAL){
    if(S.sus>=2)return 'revoked';                  /* 疑惑が重なったのに、信頼で押し切った(後日バレる) */
    if(S.sus>=1)return 'getaway';                  /* 疑惑がついたまま、信頼で押し切った */
    if(early>=2&&S.q>=72&&S.trust>=60&&S.sus===0&&!S.hits)return 'early';
    if(S.q>=80&&S.trust>=L.exTrust&&S.sus===0&&!S.hits)return 'excellent';
    if(S.down)return 'faint';                      /* 途中で一度倒れたが、書き上げた */
    if((m.toc||0)>=1&&S.q<75)return 'oldver';      /* 最終日の目次が壊れて、旧版を出した */
    if(S.q>=70&&S.trust>=55&&S.hits>0)return 'gradschool';   /* ハプニングはあったが研究は本物 */
    if(S.q>=45)return 'graduate';
    if(S.trust>=75)return 'favorite';              /* 質は低いが、教授に愛された */
    return 'charsonly';
  }
  if(S.chars>=GOAL*0.92&&S.trust<L.mercy)return 'barely';   /* あと数百字、数え間違いで受理 */
  if(S.trust>=L.mercy&&S.chars>=GOAL*0.7)return 'mercy';
  if(S.q>=80&&S.chars<GOAL*0.55)return 'refsonly';           /* 読んだけれど、書けていない */
  if((m.oversleep||0)>=1&&S.sleeps>=5)return 'slept';       /* 寝すぎて窓口が閉まった */
  return 'repeat';
}

/* ---------- 3D人物のカットシーン ----------
   cine.js(Three.js)を遅延読み込みして再生する。読めない環境では何もせずに先へ進む */
function cine(spec){
  if(window.__noCine)return Promise.resolve();
  return import('./cine.js').then(function(m){return m.play(spec)}).then(function(r){
    if(r&&r.why)toast('3Dムービーを表示できませんでした:'+r.why);
  }).catch(function(e){
    toast('3Dムービーを表示できませんでした:3D部品の読み込みに失敗('+String(e&&e.message||e).slice(0,80)+')');
  });
}
/* 画面下に数秒だけ出るお知らせ */
function toast(t){
  var d=el('div','toast');d.setAttribute('role','status');d.textContent=t;document.body.appendChild(d);
  setTimeout(function(){if(d.parentNode)d.parentNode.removeChild(d)},6000);
}
function cinePreload(names){
  if(window.__noCine)return;
  setTimeout(function(){import('./cine.js').then(function(m){m.preload(names)}).catch(function(){})},400);
}

function finish(submitEarly){
  if(submitEarly&&S.dayLog.length)hist.push(S.dayLog.join(''));
  var early=submitEarly?DAYS-S.day:0;
  var id=judge(early);
  id=rollHidden(id)||id;
  var st=$('#stage');if(st)st.innerHTML='';
  cine(submitScene(id)).then(function(){endGame(id,early)});
}

function confetti(n){
  var box=el('div','confetti');box.setAttribute('aria-hidden','true');
  var cols=['var(--marker)','var(--pen)','var(--card)','#9be08a'];
  for(var i=0;i<n;i++){
    var c=el('i');
    c.style.left=rand(0,100)+'%';c.style.background=pick(cols);
    c.style.animationDuration=(1.8+Math.random()*1.6).toFixed(2)+'s';
    c.style.animationDelay=(Math.random()*0.6).toFixed(2)+'s';
    c.style.transform='rotate('+rand(0,180)+'deg)';
    box.appendChild(c);
  }
  document.body.appendChild(box);
  setTimeout(function(){if(box.parentNode)box.parentNode.removeChild(box)},4200);
}

function calcScore(id,early){
  var sc=Math.min(S.chars/GOAL,1)*40+S.q*0.35+S.trust*0.15+S.san*0.1-S.sus*10+(early>=2?5:0);
  /* ランクとスコアが食い違わないよう、結末ごとに上限を置く */
  var CAP={repeat:45,sus:40,burnout:35,blank:5,mercy:69,charsonly:69,barely:64,getaway:58,faint:79,gradschool:89,favorite:66,slept:42,refsonly:44,oldver:60,revoked:30};
  if(CAP[id]!=null)sc=Math.min(sc,CAP[id]);
  return clamp(Math.round(sc),0,100);
}

/* ---------- mock thesis generator (no AI) ----------
   テーマ・エンディング・スコア・ステータスから、テンプレートと語彙の組み合わせで
   模擬卒論を組み立てる。内容と数値はすべて架空。実在の論文・人物は出さない。 */
function mulberry(seed){var a=seed>>>0;return function(){a=(a+0x6D2B79F5)|0;var t=Math.imul(a^(a>>>15),1|a);t=(t+Math.imul(t^(t>>>7),61|t))^t;return ((t^(t>>>14))>>>0)/4294967296}}

/* タイトル「〇〇における△△の□□」の部品を取り出す */
function parseTheme(theme, tp){
  tp=tp||{};
  var full=String(theme||'').trim();
  var has=!!full&&full!=='無題の卒論';
  var a=(tp.a||'').trim(), b=(tp.b||'').trim(), c=(tp.c||'').trim();
  if(has&&!b){ // 自由入力のタイトルからも、それなりに取り出す
    var m=full.match(/^(.+?)における(.+?)の(解析|検討|評価|比較|一考察|実証的研究|定量的評価|基礎的研究|研究|分析|調査)$/);
    if(m){a=m[1];b=m[2];c=m[3]}else{b=full.replace(/(に関する|についての|の)?(研究|一考察|考察|検討|分析|調査)$/,'')||full}
  }
  return {full:has?full:'無題の卒論',has:has,a:a||'本学の学生',b:b||'やる気',c:c||'検討',hasA:!!a};
}

function chaosify(d,o,R,P,tp){
  var m=o.marks||{}, secs=d.secs;
  function sec(h){return secs.filter(function(s){return s.h.indexOf(h)>=0})[0]}
  function anyP(){var c=secs.filter(function(s){return s.p.length&&s.h!=='要旨'&&s.h!=='謝辞'});return c.length?P(c):null}
  function mid(x,ins){var i=Math.floor(x.length*(0.3+R()*0.4));return x.slice(0,i)+ins+x.slice(i)}
  var s;
  if(m.cat&&(s=anyP())){var k=Math.floor(R()*s.p.length);s.p[k]=mid(s.p[k],'jjjjjjjjjjjjjjjjjj;;;;;;;;')}
  if(m.ai&&(s=sec('考察')||anyP())){s.p.unshift('ご質問ありがとうございます!以下に考察をわかりやすくまとめます。');s.p.push('他にお手伝いできることはありますか?')}
  if(m.senpai&&(s=sec('はじめに')||anyP()))s.p.push('本研究では、「'+P(TH_OTHER)+'」について明らかにすることを目的とする(※先輩の卒論から消し忘れ)。');
  if(m.night&&(s=sec('おわりに')||anyP()))s.p.push(P(TH_POEM));
  if(m.ene){secs.forEach(function(x){if(x.h!=='謝辞'&&R()<0.5)x.p=x.p.map(function(y){return y.replace(/。$/,'!!')})});if(s=sec('考察'))s.p.push('エナジー全開で考察する!!!!!')}
  if(m.lost&&(s=sec('結果')||anyP()))s.p.push('(ここには昨日まで3ページあった)');
  if(m.rush&&(s=anyP())){var x=P(s.p);s.p.splice(s.p.indexOf(x)+1,0,x,x)}
  if(m.fail&&(s=sec('結果')))s.p.push('なお、対照区のほうが元気だった。これも立派な結果である。');
  if(m.novel&&(s=sec('はじめに')))s.p.push('先行研究は存在しない(探していない)。');
  if(m.down&&(s=anyP()))s.p.push('(この章を書いた記憶がない)');
  if(m.toc)P(secs).h='エラー! 参照元が見つかりません。';
  /* 誤爆:恋人・親へのトーク、ラブレター */
  var T=tp&&tp.has?'「'+tp.core+'」':'卒論';
  var fl=function(a){return a.map(function(x){return x.split('{T}').join(T)})};
  function put(names,obj){var c=names.map(sec).filter(Boolean);var t=c.length?P(c):anyP();if(t)(t.x=t.x||[]).push(obj)}
  var lov=m.lover,par=m.parent,let_=m.letter;
  if((o.chaos||0)>=4&&!lov&&!par&&!let_&&R()<0.6){var r=Math.floor(R()*3);if(r===0)lov=1;else if(r===1)par=1;else let_=1}
  if(lov)put(['考察','結果','はじめに'],{k:'line',to:'恋人',msgs:fl(P(TH_LOVER)),note:P(TH_OOPS)});
  if(par)put(['方法','おわりに','結果'],{k:'line',to:'母',msgs:fl(P(TH_PARENT)),note:P(TH_OOPS)});
  if(let_)put(['考察','はじめに','おわりに'],{k:'letter',lines:fl(P(TH_LETTER)),note:'※本文の途中に紛れ込んでいた便箋'});
  if(o.scraps&&o.scraps.length&&(s=sec('考察')||sec('結果')||anyP()))s.p.push(o.scraps.slice(0,4).join('。')+'。');
  var lv=o.chaos||0;
  if(lv>=3)secs.forEach(function(x){x.p=x.p.map(function(y){TH_TYPO.forEach(function(t){if(R()<0.5)y=y.split(t[0]).join(t[1])});return y})});
  if(lv>=4&&secs.length>3){
    var a=1+Math.floor(R()*(secs.length-2)),b=1+Math.floor(R()*(secs.length-2)),t=secs[a];secs[a]=secs[b];secs[b]=t;
    secs.forEach(function(x){if(R()<0.4)x.h=x.h.replace(/^(\d)/,function(n){return P([n+'.5',String(+n+1),n+'(仮)'])})});
  }
  if(lv>=5){d.title+='(仮)(最終)(本当に最終)';d.sub='—'+P(TH_OTHER)+'に着目して—'}
}

function makeThesis(o){
  var R=mulberry(o.seed||1);
  var P=function(a){return a[Math.floor(R()*a.length)]};
  var N=function(a,b){return Math.floor(R()*(b-a+1))+a};
  var tp=parseTheme(o.theme,o.tp), id=o.end, st=o.stats||{};
  var lab=o.lab||LAB_BY_ID.normal, sur=o.sur||'〇〇';
  var A=tp.a, B=tp.b, C=tp.c;
  var n=N(3,9)*(R()<0.5?1:7), mm=(N(12,98)/10).toFixed(1), sd=(N(3,40)/10).toFixed(1), rr=N(41,93);
  var V={A:A,B:B,C:C,AB:(tp.hasA?A+'における':'')+B,n:n,m:mm,sd:sd,rr:rr,
    dodged:st.dodged||0,sleeps:st.sleeps||0,writes:st.writes||0,minSan:st.minSan==null?100:st.minSan,cut:st.cut||0,backups:st.backups||0,
    early:o.early||0,sur:sur,unit:P(['点','回','分','pt','単位(仮)','B値']),
    p:o.q<30?'p ≈ 0.05くらい':'p = '+P(['0.003','0.012','0.021','0.034','0.049'])};
  var good=id==='early'||id==='excellent';
  var special=!!(END_BY_ID[id]&&END_BY_ID[id].hidden);
  var FPOOL=good?FINDINGS.filter(function(x){return x.ser}):FINDINGS;
  var FD=FPOOL[Math.floor(R()*FPOOL.length)];
  V.why=FD.why;V.peak=FD.peak;V.cor=FD.cor;V.fut=FD.fut;
  function f(s){
    s=s.replace(/\{res\}/g,FD.res);
    s=s.replace(/\{([^{}]*\|[^{}]*)\}/g,function(_,x){return P(x.split('|'))});
    return s.replace(/\{(\w+)\}/g,function(_,k){return V[k]!=null?V[k]:''});

var TH_NOTICE='※ゲームが作った架空の卒論です。内容・数値・文献はすべて実在しません。';
function thesisHTML(d){
  var h='<p class="th-fict">'+esc(TH_NOTICE)+'</p>';
  h+='<h4 class="th-title">'+esc(d.title)+'</h4>';
  if(d.sub)h+='<p class="th-sub">'+esc(d.sub)+'</p>';
  h+='<p class="th-meta">'+d.meta.map(esc).join('<br>')+'</p>';
  d.secs.forEach(function(s){
    h+='<h5>■ '+esc(s.h)+'</h5>';
    if(s.p.length)h+='<p>'+s.p.map(esc).join('')+'</p>';
    if(s.table){var t=s.table;h+='<figure class="th-tab"><figcaption>'+esc(t.cap)+'</figcaption><table><thead><tr>'+t.head.map(function(c){return '<th>'+esc(c)+'</th>'}).join('')+'</tr></thead><tbody>'+t.rows.map(function(r){return '<tr>'+r.map(function(c){return '<td>'+esc(c)+'</td>'}).join('')+'</tr>'}).join('')+'</tbody></table></figure>'}
    if(s.fig)h+='<figure class="th-fig"><div class="th-chart" aria-hidden="true"><i style="height:22%"></i><i style="height:35%"></i><i style="height:30%"></i><i style="height:58%"></i><i style="height:96%"></i></div><figcaption>'+esc(s.fig)+'</figcaption></figure>';
    if(s.li)h+=(s.h==='参考文献'?'<ul class="th-refs">':'<ul>')+s.li.map(function(x){return '<li>'+(x?esc(x):'&nbsp;')+'</li>'}).join('')+'</ul>';
    (s.red||[]).forEach(function(r){h+='<p class="th-red">'+esc(r)+'</p>'});
    (s.x||[]).forEach(function(x){h+=extraHTML(x)});
  });
  if(d.tail)h+='<p class="th-tail">'+esc(d.tail)+'</p>';
  return h;
}
function extraHTML(x){
  if(x.k==='line'){
    return '<div class="th-line" role="note"><div class="lh">トーク ▸ '+esc(x.to)+'</div>'+
      x.msgs.map(function(m){return '<p class="bub '+(m.charAt(0)==='<'?'me':'them')+'">'+esc(m.slice(1))+'</p>'}).join('')+
      '<div class="lf">'+esc(x.note)+'</div></div>';
  }
  var l=x.lines;
  return '<div class="th-letter" role="note">'+l.map(function(t,i){return '<p'+(i===0?' class="to"':'')+'>'+esc(t)+'</p>'}).join('')+
    '<p class="sig">卒論を書いている者より</p><div class="lf">'+esc(x.note)+'</div></div>';
}
function extraText(x){
  if(x.k==='line')return '\n> [トーク ▸ '+x.to+']\n'+x.msgs.map(function(m){return '> '+(m.charAt(0)==='<'?'自分':x.to)+':'+m.slice(1)}).join('\n')+'\n> '+x.note+'\n';
  return '\n> '+x.lines.join('\n> ')+'\n> 卒論を書いている者より\n> '+x.note+'\n';
}
function thesisText(d){
  var t='# '+d.title+'\n'+(d.sub?d.sub+'\n':'')+'\n'+TH_NOTICE+'\n\n'+d.meta.join('\n')+'\n';
  d.secs.forEach(function(s){
    t+='\n## '+s.h+'\n\n';
    if(s.p.length)t+=s.p.join('')+'\n';
    if(s.table){t+='\n'+s.table.cap+'\n\n| '+s.table.head.join(' | ')+' |\n|'+s.table.head.map(function(){return '---'}).join('|')+'|\n'+s.table.rows.map(function(r){return '| '+r.join(' | ')+' |'}).join('\n')+'\n'}
    if(s.fig)t+='\n('+s.fig+')\n';
    if(s.li)t+=s.li.map(function(x){return '- '+x}).join('\n')+'\n';
    (s.red||[]).forEach(function(r){t+='\n> 赤ペン:'+r+'\n'});
    (s.x||[]).forEach(function(x){t+=extraText(x)});
  });
  if(d.tail)t+='\n'+d.tail+'\n';
  return t;
}

function saveFile(name,text,say){
  function blob(){
    try{
      var u=URL.createObjectURL(new Blob([text],{type:'text/markdown;charset=utf-8'}));
      var a=document.createElement('a');a.href=u;a.download=name;a.rel='noopener';
      document.body.appendChild(a);a.click();
      setTimeout(function(){URL.revokeObjectURL(u);if(a.parentNode)a.parentNode.removeChild(a)},1500);
    }catch(e){say('保存できませんでした。コピーを使ってください。')}
  }
  if(window.claude&&window.claude.use){
    window.claude.use('downloads').then(function(dl){
      if(!dl)return blob();
      return dl.save({filename:name,data:text}).catch(function(e){if(!e||e.code!=='declined')blob()});
    }).catch(blob);
  }else blob();
}

function setupThesis(E,ctx,score,theme){

  };
  $('#psave').onclick=function(){saveFile('模擬卒論.md',last,say)};

  /* claude.ai上で開いたときだけ:Claudeに書き直してもらう(任意) */

        '【卒論のテーマ】'+theme+'\n'+

        '【ステータス】文字数 '+snap.chars+'/'+GOAL+'、研究の質 '+snap.q+'/100、教授の信頼 '+snap.trust+'/100、正気度 '+snap.san+'/100、不正疑惑 '+snap.sus+'\n'+
        '【出来のスタイル】'+STYLE_BY_END[E.id]+'\n\n'+
        '【書き方の条件】\n'+
        '- 点数が高いほど、論理と文章の質を高くする。低いほど、スタイルの指示どおりに崩す。ただし笑える範囲で、悪意や攻撃的な内容は入れない。\n'+
        '- 構成:タイトル / ■要旨 / ■1 はじめに / ■2 方法 / ■3 結果 / ■4 考察 / ■5 おわりに。各節は2〜4文。全体で700〜1000字。\n'+
        '- マークダウン記法(#や**)は使わず、プレーンテキストで書く。\n'+
        '- 数値や結果は架空のものとして控えめに書く。実在の論文、人物、団体、URLは出さない。参考文献欄は作らない。\n'+
        '- 前置きや解説は書かず、卒論の本文だけを出力する。';
      var done=function(t){last=TH_NOTICE+'\n\n'+t;paper.textContent=last;btns.hidden=false;aiBtn.disabled=false;aiBtn.textContent='Claudeにもう一度書いてもらう'};
      sample(prompt,{modelTier:'default',cache:false,onText:function(o){paper.textContent=TH_NOTICE+'\n\n'+o.text}}).then(function(r){done(r.text)}).catch(function(e){

      });

}

}
